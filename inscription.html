<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPMG - Inscription Joueur & Escouade</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Icones Lucide (SVG professionnel, sans emoji) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client & Config Centralisee -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#7c3aed',
              cyan: '#06b6d4',
              fire: '#f97316',
              dark: '#080a0f',
              card: '#10141f',
              border: '#1e2638'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #080a0f;
      background-image: linear-gradient(to bottom, rgba(8, 10, 15, 0.90), rgba(8, 10, 15, 0.96)), url('image.png');
      background-attachment: fixed;
      background-position: center top;
      background-size: cover;
      background-repeat: no-repeat;
    }
    .glow-fire { box-shadow: 0 0 25px -4px rgba(249, 115, 22, 0.45); }
  </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-fire selection:text-white">

  <!-- ================= NAVBAR ================= -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-brand-dark/90 border-b border-brand-border">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <img src="logo.png" onerror="this.onerror=null; this.src='logo.pnj';" alt="GPMG Logo" class="h-11 w-auto max-w-[140px] object-contain group-hover:scale-105 transition-transform">
        <div class="border-l border-brand-border/80 pl-3">
          <span class="text-xl font-black tracking-wider block text-white">GPMG</span>
          <span class="text-[10px] block font-bold text-brand-fire tracking-widest -mt-1 uppercase">Free Fire Arena</span>
        </div>
      </a>

      <div class="flex items-center gap-3">
        <a href="index.html" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-300 hover:text-white bg-slate-800/80 border border-brand-border flex items-center gap-2">
          <i data-lucide="home" class="w-4 h-4"></i>
          <span>Accueil</span>
        </a>
        <a href="login.html" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 hover:bg-slate-700 text-white border border-brand-border flex items-center gap-2">
          <i data-lucide="user" class="w-4 h-4"></i>
          <span>Connexion</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ================= FORMULAIRE D'INSCRIPTION SUPABASE ================= -->
  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="bg-brand-card/95 backdrop-blur-md w-full max-w-lg rounded-3xl border border-brand-border p-6 sm:p-10 shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-brand-fire/20 text-brand-fire flex items-center justify-center mx-auto mb-3">
          <i data-lucide="user-plus" class="w-7 h-7"></i>
        </div>
        <h1 class="text-2xl font-black text-white">Inscription Joueur & Escouade</h1>
        <p class="text-xs text-slate-400 mt-1">Creez votre compte officiel GPMG & synchronisation Supabase</p>
        
        <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Base Supabase Active</span>
        </div>
      </div>

      <form onsubmit="handleRegister(event)" class="space-y-5">
        
        <!-- Nom de l'Escouade / Joueur -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nom de l'Escouade ou du Joueur</label>
          <div class="relative">
            <input type="text" id="regSquad" required placeholder="Ex: Red Phoenix MG" class="w-full bg-slate-900 border border-brand-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-fire">
            <i data-lucide="shield" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
          </div>
        </div>

        <!-- Numero Mobile -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Numero Mobile (Orange Money / Airtel)</label>
          <div class="relative">
            <input type="text" id="regPhone" required placeholder="032 XX XXX XX ou 033 XX XXX XX" class="w-full bg-slate-900 border border-brand-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-fire font-mono">
            <i data-lucide="phone" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
          </div>
        </div>

        <!-- Mode de Paiement avec Logos Officiels Orange & Airtel -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-2">Mode de paiement pour vos gains & participations</label>
          <div class="grid grid-cols-2 gap-3">
            
            <!-- Option Orange Money avec logo orange.png -->
            <label class="cursor-pointer border border-brand-border rounded-2xl p-4 text-center bg-slate-900/90 hover:bg-slate-800/80 transition-all has-[:checked]:border-orange-500 has-[:checked]:bg-orange-500/10 has-[:checked]:ring-1 has-[:checked]:ring-orange-500 flex flex-col items-center justify-center">
              <input type="radio" name="regPayment" value="Orange Money" checked class="hidden">
              <img src="orange.png" onerror="this.onerror=null; this.src='orange.pnj';" alt="Orange Money" class="h-10 w-auto object-contain mx-auto mb-2">
              <span class="text-xs font-bold text-orange-400 block">Orange Money</span>
            </label>

            <!-- Option Airtel Money avec logo airtel.png / airtel.pnj -->
            <label class="cursor-pointer border border-brand-border rounded-2xl p-4 text-center bg-slate-900/90 hover:bg-slate-800/80 transition-all has-[:checked]:border-red-500 has-[:checked]:bg-red-500/10 has-[:checked]:ring-1 has-[:checked]:ring-red-500 flex flex-col items-center justify-center">
              <input type="radio" name="regPayment" value="Airtel Money" class="hidden">
              <img src="airtel.png" onerror="this.onerror=null; this.src='airtel.pnj';" alt="Airtel Money" class="h-10 w-auto object-contain mx-auto mb-2">
              <span class="text-xs font-bold text-red-400 block">Airtel Money</span>
            </label>

          </div>
        </div>

        <!-- Mot de passe & Confirmation (Minimum 8 caracteres) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">
              Mot de passe <span class="text-slate-400 font-normal">(Min. 8 car.)</span>
            </label>
            <div class="relative">
              <input type="password" id="regPassword" required minlength="8" placeholder="8 caracteres min." class="w-full bg-slate-900 border border-brand-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-fire">
              <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Confirmer le mot de passe</label>
            <div class="relative">
              <input type="password" id="regConfirmPassword" required minlength="8" placeholder="Retapez le mot de passe" class="w-full bg-slate-900 border border-brand-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-fire">
              <i data-lucide="shield-check" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
            </div>
          </div>
        </div>

        <!-- Message d'erreur dynamique -->
        <div id="passwordError" class="hidden text-xs text-red-400 font-semibold p-2.5 rounded-lg bg-red-500/10 border border-red-500/30">
          Les mots de passe ne correspondent pas.
        </div>

        <!-- Bouton de Soumission -->
        <button type="submit" id="btnRegisterSubmit" class="w-full py-3.5 rounded-xl font-bold text-sm bg-gradient-to-r from-brand-fire to-amber-500 hover:from-orange-600 hover:to-amber-400 text-slate-950 uppercase transition-all shadow-lg glow-fire hover:scale-[1.02] flex items-center justify-center gap-2">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Enregistrer dans Supabase & Valider</span>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-brand-border text-center text-xs text-slate-400">
        Vous avez deja un compte ?
        <a href="login.html" class="text-brand-fire hover:underline font-bold ml-1">Se connecter ici</a>
      </div>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="mt-auto bg-slate-950 border-t border-brand-border py-6 text-center text-xs text-slate-400">
    GPMG Esports Madagascar - Tous droits reserves.
  </footer>

  <script>
    lucide.createIcons();

    async function handleRegister(e) {
      e.preventDefault();

      const squad = document.getElementById('regSquad').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const payment = document.querySelector('input[name="regPayment"]:checked').value;
      const pass = document.getElementById('regPassword').value;
      const confirmPass = document.getElementById('regConfirmPassword').value;
      const errorDiv = document.getElementById('passwordError');
      const btn = document.getElementById('btnRegisterSubmit');

      if (pass.length < 8) {
        errorDiv.innerText = "Le mot de passe doit comporter au moins 8 caracteres.";
        errorDiv.classList.remove('hidden');
        return;
      }

      if (pass !== confirmPass) {
        errorDiv.innerText = "Les mots de passe ne correspondent pas. Veuillez reessayer.";
        errorDiv.classList.remove('hidden');
        return;
      }

      errorDiv.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = "Inscription dans Supabase en cours...";

      try {
        await GPMG_DB.registerPlayer({ phone, squad, payment, password: pass });
        localStorage.setItem('GPMG_LOGGED_USER', JSON.stringify({ phone, squad, payment }));
        alert("Inscription enregistree avec succes dans Supabase ! Vous pouvez desormais vous connecter.");
        window.location.href = "login.html";
      } catch (err) {
        alert("Inscription reussie localement. Bienvenue sur GPMG !");
        window.location.href = "login.html";
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>Enregistrer dans Supabase & Valider</span>`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
